<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A 35mm film canister with its leader pulled out, in the site's colours. -->
  <rect width="32" height="32" rx="7" fill="#0b0f17"/>
  <!-- Leader: the film tongue, with sprocket holes along both edges. -->
  <path d="M15 10.5h9.5c2.2 0 3.5 1.3 3.5 3.2v7.8H15z" fill="#93c5fd"/>
  <g fill="#0b0f17">
    <rect x="17" y="12" width="2" height="1.8" rx=".4"/>
    <rect x="20.5" y="12" width="2" height="1.8" rx=".4"/>
    <rect x="24" y="12" width="2" height="1.8" rx=".4"/>
    <rect x="17" y="18.2" width="2" height="1.8" rx=".4"/>
    <rect x="20.5" y="18.2" width="2" height="1.8" rx=".4"/>
    <rect x="24" y="18.2" width="2" height="1.8" rx=".4"/>
  </g>
  <!-- Canister: spool ends, body, and label band. -->
  <rect x="7.5" y="4" width="5" height="3.5" rx="1" fill="#60a5fa"/>
  <rect x="7.5" y="24.5" width="5" height="3.5" rx="1" fill="#60a5fa"/>
  <rect x="4" y="6.5" width="12" height="19" rx="2.5" fill="#60a5fa"/>
  <rect x="4" y="12" width="12" height="8" fill="#fbbf24"/>
</svg>
